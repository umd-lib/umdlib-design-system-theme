$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: UMD Lib Accordion - Child
label: Accordion
group: UMD Libraries

props:
  type: object
  properties:
    componentid:
      type: string
      title: Component ID
      description: (Optional) An ID to use for the component. This can be used for section referencing.
    heading_level:
      type: string
      title: Heading Level
      description: Choose the HTML heading level for the accordion title.
      enum:
        - h2
        - h3
        - h4
        - h5
        - h6
      default: h3
    default_open:
      type: boolean
      title: Default Open
      description: Set to true if the accordion item should be open by default.

slots:
  title:
    title: Accordion Item Title (Text String)
  body:
    title: Body (UMD Lib Text or Component)
  link_text:
    title: Link Text (Text String)
  link_url:
    title: Link URL (Text String)
