$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: UMD Lib Alert
label: Alert
group: UMD Libraries

variants:
  in_page:
    title: In-Page Alert
  site_wide:
    title: Site-Wide Alert

props:
  type: object
  properties:
    variant:
      type: string
      title: Alert Variant
      description: Choose the alert variant
      enum:
        - in_page
        - site_wide
      default: in_page
    heading_level:
      type: string
      title: Heading Level
      description: Choose the HTML heading level for the alert title (in-page variant only).
      enum:
        - h2
        - h3
        - h4
        - h5
        - h6
      default: h2
    componentid:
      type: string
      title: Component ID
      description: (Optional) An ID to use for the component. This can be used for section referencing.

slots:
  title:
    title: Alert Title (Text String)
  alert_description:
    title: Alert Description (WYSIWYG)
  link_text:
    title: Link Text (Text String)
  link_url:
    title: Link URL (Dynamic Link or Text String)
