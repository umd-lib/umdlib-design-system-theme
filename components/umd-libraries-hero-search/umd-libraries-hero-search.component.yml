$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: UMD Lib Hero Search
label: Homepage Hero Search Box
group: UMD Libraries

props:
  type: object
  properties:
    search_title:
      type: string
      title: Search Title
      description: The heading displayed above the search tabs (e.g. "Search").
      default: Search
    learn_more_text:
      type: string
      title: Learn More Link Text
      description: Text for the "learn about search options" link.
      default: Learn about search options.
    learn_more_url:
      type: string
      title: Learn More URL
      description: URL for the "learn about search options" link.
    discover_url:
      type: string
      title: UMD Discover URL
      description: Base URL for UMD Discover. The search term is appended directly to this URL.
    search_all_url:
      type: string
      title: Search All URL
      description: URL for the Search All form. The search term is appended as a "query" parameter.
    discover_placeholder:
      type: string
      title: UMD Discover Input Placeholder
      default: Search for books, articles, journals, and more...
    search_all_placeholder:
      type: string
      title: Search All Input Placeholder
      default: Search libraries collections, websites, research guides and more...
    discover_description:
      type: string
      title: UMD Discover Tab Description
      description: Short description displayed below the UMD Discover search input.
    search_all_description:
      type: string
      title: Search All Tab Description
      description: Short description displayed below the Search All search input.
    resources_title:
      type: string
      title: Resources Section Title
      default: Resources
    feedback_url:
      type: string
      title: Feedback Form URL
      description: URL for the feedback form link in the footer.
    feedback_link_text:
      type: string
      title: Feedback Link Text
      description: The linked portion of the feedback footer text (e.g. "the feedback form").
      default: the feedback form
    image_url:
      type: string
      title: Hero Image URL
    image_alt:
      type: string
      title: Hero Image Alt Text
    tab_label:
      type: string
      title: Accessible Tab Group Label
      description: Screen-reader-only label for the tab group.
      default: Search tabs
    componentid:
      type: string
      title: Component ID
      description: (Optional) An ID to use for the component. This can be used for section referencing.

slots:
  quick_actions_slot:
    title: Quick Actions (UMD Lib Hero Search Quick Action)
    description: Place UMD Lib Hero Search Quick Action components here.
  resource_links_slot:
    title: Resource Links (UMD Lib Emphasized Link)
    description: Place UMD Lib Emphasized Link components here.
  image_caption_slot:
    title: Hero Image Caption (WYSIWYG)
    description: Caption text displayed over the hero image.
