$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: UMD Lib Component Layout
label: WWW
group: UMD Libraries

props:
  properties:
    columns:
      type: string
      title: Columns
      description: Choose the number of columns
      enum:
        - "1"
        - "2"
        - "3"
        - "4"
    componentid:
      type: string
      title: Component ID
      description: (Optional) An ID to use for the component. This can be used for section referencing.
    homepage_news:
      type: boolean
      title: Homepage News
      description: Whether this component is used on the homepage news section.

slots:
  components:
    title: Component Slot (Components)
