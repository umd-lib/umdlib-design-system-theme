$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: UMD Lib Section Intro
label: Section Intro
group: UMD Libraries

props:
  type: object
  properties:
    heading_level:
      type: string
      title: Heading Level
      description: Choose the HTML heading level for the section heading.
      enum:
        - h2
        - h3
        - h4
        - h5
        - h6
      default: h2
    componentid:
      type: string
      title: Component ID
      description: (Optional) An ID to use for the component. This can be used for section referencing.

slots:
  heading_text:
    title: Heading Text (Text String)
  link_text:
    title: Link Text (Text String)
  link_url:
    title: Link URL (Dynamic Link or Text String)
