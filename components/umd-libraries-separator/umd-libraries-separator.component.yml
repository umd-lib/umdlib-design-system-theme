$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: UMD Lib Separator
label: Separator
group: UMD Libraries

variants:
  red:
    title: Red
  yellow:
    title: Yellow
  gray:
    title: Gray
  bronze:
    title: Bronze
  black:
    title: Black

props:
  type: object
  properties:
    variant:
      type: string
      title: Color 
      description: Line color.
      enum:
        - red
        - yellow
        - gray
        - bronze
        - black
    margin:
      type: string
      title: Margin Height
      description: Margin height.
      enum:
        - wide
        - medium
        - small
    componentid:
      type: string
      title: Component ID
      description: (Optional) An ID to use for the component. This can be used for section referencing.
