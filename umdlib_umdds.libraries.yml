# Design tokens only: :root custom properties and the .dark-theme remap.
# Self-contained and safe to attach on its own by consumers that just want the
# token layer.
tokens:
  css:
    theme:
      css/tokens.css: {}
# Font faces. Kept separate so the token and utility layers can depend on it
# without carrying the base64 payload inline.
fonts:
  css:
    theme:
      css/fonts.css: {}
# Utility classes (typography, color, animation, icons, layout, spacing).
# Depend on tokens (var(--*)) and fonts (font-family names).
utilities:
  dependencies:
    - umdlib_umdds/tokens
    - umdlib_umdds/fonts
  css:
    theme:
      css/utilities.css: {}
umdlib:
  header: true
  dependencies:
    - umdlib_umdds/tokens
    - umdlib_umdds/fonts
    - umdlib_umdds/utilities
  css:
    theme:
      css/base.css: {}
      css/internal/admin.css: {}
      css/external/system-nav.css: {}
      css/external/search-feature.css: {}
      css/external/umd-lib-layout.css: {}
      css/external/multilang.css: {}
      css/external/webforms.css: {}
  js:
    js/lucide.min.js: {}
    js/clipboard.min.js: {}
    js/language-block.js: {}
umd-lib-layout:
  css:
    theme:
      css/external/umd-lib-layout.css: {}
  js:
    js/umd-lib-layout.js: {}
umd-libraries-tabs:
  css:
    component:
      components/umd-libraries-tabs/umd-libraries-tabs.css: {}
  js:
    components/umd-libraries-tabs/umd-libraries-tabs.js: {}
umd-libraries-hero-search:
  dependencies:
    - umdlib_umdds/umd-libraries-tabs
  css:
    component:
      components/umd-libraries-hero-search/umd-libraries-hero-search.css: {}
  js:
    components/umd-libraries-hero-search/umd-libraries-hero-search.js: {}
